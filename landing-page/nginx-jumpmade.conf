# nginx site config for jumpmade.com
# Deploy to: /etc/nginx/sites-available/jumpmade.com
# Symlink:   /etc/nginx/sites-enabled/jumpmade.com
# Initial state: HTTP only. After DNS cutover, run:
#   sudo certbot --nginx -d jumpmade.com -d www.jumpmade.com -d firstquotesystem.co.uk -d www.firstquotesystem.co.uk
# certbot will rewrite this file to add the 443 listeners + ssl_certificate paths.

# ============================================================
# jumpmade.com + www.jumpmade.com — main site
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name jumpmade.com www.jumpmade.com;

    root /var/www/jumpmade.com;
    index index.html;

    # Hashed/long-lived assets (favicon.svg, og-image.png, fonts, css)
    location ~* ^/(assets|dist)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML — short cache so we can ship updates fast
    location / {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Don't leak nginx version
    server_tokens off;
}

# ============================================================
# firstquotesystem.co.uk → permanent redirect to jumpmade.com
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name firstquotesystem.co.uk www.firstquotesystem.co.uk;
    return 301 https://jumpmade.com$request_uri;
}
